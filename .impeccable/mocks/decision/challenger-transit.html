<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #f4f7fb; color: #0e1c3f; font-family: Figtree, sans-serif; }
  .body { display: grid; grid-template-columns: 260px 1fr; height: 900px; }
  nav { background: #0e1c3f; color: #f4f7fb; padding: 22px 16px; }
  nav h1 { font-size: 28px; margin-bottom: 18px; }
  nav button { display: block; width: 100%; text-align: left; background: transparent; color: #c9d4ea; border: 0; padding: 8px 10px; font: inherit; }
  nav button.on { color: #fff; background: #1a3268; border-radius: 8px; }
  main { padding: 24px 32px; position: relative; }
  main h2 { font-size: 32px; }
  svg { width: 100%; height: 620px; margin-top: 12px; }
  .stations text { font: 600 16px Figtree, sans-serif; fill: #0e1c3f; }
  .dim { stroke: #c5d0e0; stroke-width: 8; fill: none; }
  .hot { stroke: #e23b2f; stroke-width: 8; fill: none; }
  .note { position: absolute; right: 40px; top: 120px; background: #fff; border-radius: 12px; padding: 16px 18px; width: 240px; box-shadow: 0 8px 20px rgba(14, 28, 63, 0.08); }
  .note strong { color: #e23b2f; }
</style>
</head>
<body>
  <div class="body">
    <nav>
      <h1>Coffee order</h1>
      <button class="on">Pay and leave</button>
      <button>Change the drink</button>
      <button>Pickup</button>
      <button>Specs</button>
    </nav>
    <main>
      <h2>Pay and leave</h2>
      <svg viewBox="0 0 900 520">
        <path class="dim" d="M80 120 H280 V300 H520" />
        <path class="hot" d="M80 220 H300 H520 H760" />
        <g class="stations">
          <circle cx="80" cy="220" r="14" fill="#0e1c3f" />
          <text x="80" y="190">Reviewing the cart</text>
          <circle cx="300" cy="220" r="14" fill="#e23b2f" />
          <text x="250" y="190">Checking out</text>
          <circle cx="520" cy="220" r="16" fill="#fff" stroke="#e23b2f" stroke-width="4" />
          <text x="470" y="270">Payment fails</text>
          <circle cx="760" cy="220" r="14" fill="#c5d0e0" />
          <text x="680" y="190">Order in progress</text>
        </g>
      </svg>
      <div class="note"><strong>Payment fails</strong><p>Scene held. The rest of the order stays on the map.</p></div>
    </main>
  </div>
</body>
</html>
