# CI and release in one workflow. npm Trusted Publishing is pinned to this filename: keep it `ci.yml`.
#
# A commit on main is published only after `check` passed for that same commit, so it does not
# matter how the commit got there (a merged pull request or a direct push). `check` ends with the
# consumer smoke: the packed tarball installed into a clean project, the way a project using Atlas
# from npm gets it.
#
# Everything runs on Bun, at the version `packageManager` names in package.json. Node is set up in
# two places only: the consumer smoke, which proves the published package also runs on Node, and the
# release, because npm Trusted Publishing needs the npm CLI.
#
# The schedule and manual dispatch exist to finish an interrupted release (an npm or GitHub outage).
# Every release step is idempotent, so a run with nothing left to do publishes nothing.
# See docs/releasing.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

# A pull request's runs replace each other. Runs on main never cancel: each has its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  # Commit types decide the next version (docs/releasing.md), so they are checked.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Merge commits land on main, so every commit of the pull request can drive a release.
      - name: Validate PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-list --first-parent --reverse "$BASE..$HEAD" |
          while read -r commit; do
            git show --no-patch --format=%B "$commit" | bunx --no -- commitlint --verbose
          done
      # A squash merge makes the title the commit.
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Only for the consumer smoke: the published package has to run on Node as well.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Documentation contracts (generated docs, schemas, links, agent commands and examples)
        run: bun run docs:check
      - run: bun run type-check
      - run: bun run test
      - run: bun run build
      - name: Consumer smoke (pack, install, import, type-check, tree-shake and run the published package on Bun and Node)
        run: bun run release:smoke

  # The object-store backend against a real S3 server (SeaweedFS), which verifies request signatures and
  # paginates listings the way S3 does. The unit tests cannot stand in for that.
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start an S3 server
        run: |
          cat > "$RUNNER_TEMP/s3.json" <<'JSON'
          {"identities":[{"name":"admin","credentials":[{"accessKey":"atlaskey","secretKey":"atlassecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name s3 -p 18333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json" chrislusf/seaweedfs:latest server -s3 -s3.config=/etc/s3.json -dir=/data
          export AWS_ACCESS_KEY_ID=atlaskey AWS_SECRET_ACCESS_KEY=atlassecret AWS_DEFAULT_REGION=us-east-1
          for i in $(seq 1 60); do aws --endpoint-url http://localhost:18333 s3 mb s3://atlas-test 2>/dev/null && break; sleep 2; done
          aws --endpoint-url http://localhost:18333 s3 ls
          # Creating a bucket only checks metadata. The first upload allocates writable volumes,
          # which must finish before a test starts its five-second timeout.
          printf 'ready\n' > "$RUNNER_TEMP/s3-ready"
          aws --endpoint-url http://localhost:18333 s3 cp "$RUNNER_TEMP/s3-ready" s3://atlas-test/.ci-ready
          aws --endpoint-url http://localhost:18333 s3 cp s3://atlas-test/.ci-ready "$RUNNER_TEMP/s3-ready-read"
          cmp "$RUNNER_TEMP/s3-ready" "$RUNNER_TEMP/s3-ready-read"
          aws --endpoint-url http://localhost:18333 s3 rm s3://atlas-test/.ci-ready
      - name: Run the S3 store and node tests against it
        env:
          ATLAS_TEST_S3_ENDPOINT: http://localhost:18333
          ATLAS_TEST_S3_BUCKET: atlas-test
          ATLAS_TEST_S3_KEY: atlaskey
          ATLAS_TEST_S3_SECRET: atlassecret
        run: bun test packages/reports/tests/s3-store.integration.test.ts packages/reports/tests/s3-flow.integration.test.ts

  # The todo example, run for real: once in a single browser and once across a phone, a desktop and
  # a server. The two runs share nothing, so each gets its own job.
  example:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        script: [run, clients]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Start the Atlas report server
        if: matrix.script == 'run'
        run: |
          bun atlas --data "$RUNNER_TEMP/atlas-data" --no-log > "$RUNNER_TEMP/atlas-server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:5180/readyz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/atlas-server.log"
          exit 1
      - run: bun run example:${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-runs-${{ matrix.script }}
          path: examples/todo/atlas-runs

  # Build and exercise the exact image on PRs too, without registry credentials.
  # This publishes every green main commit, including commits that need no npm release.
  image:
    name: Server image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atlas-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/crvouga/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: docker/setup-buildx-action@v4.0.0
      - name: Build the server and viewer from this commit
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64
          build-args: ATLAS_REVISION=${{ github.sha }}
          load: true
          tags: atlas-server:ci
          cache-from: type=gha,scope=atlas-server
          cache-to: type=gha,scope=atlas-server,mode=max
      - name: Exercise the container as a Railway image service
        run: bun scripts/container-smoke.ts atlas-server:ci
      - name: Log in to personal GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker tag atlas-server:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          # Jobs are serialized, but GitHub does not guarantee queue order. An older run must
          # never move latest backwards after a newer commit has reached main.
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            docker tag atlas-server:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "Published $IMAGE:$GITHUB_SHA; a newer main commit owns latest."
          fi

  release:
    name: Release
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One release at a time, and never cancelled halfway through a publish.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      # Comments on the issues a release closes, with the version that carries the fix.
      issues: write
    steps:
      # Tags are the versions, so the whole history and every tag is needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # For the npm CLI only. Do not set registry-url: setup-node then writes legacy _authToken
      # config, which prevents npm from starting the OIDC exchange when no token exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - name: Plan
        id: plan
        run: bun run release:plan --github-output
      - name: Build
        if: steps.plan.outputs.has_changes == 'true'
        run: bun run build
      - name: Publish, tag, and create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bun run release:publish
