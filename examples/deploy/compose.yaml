# Try the whole thing on one machine: an S3 server, a bucket, and the Atlas node.
#
#   docker compose up --build
#   # publish from your project (another terminal):
#   export AWS_ACCESS_KEY_ID=atlaskey AWS_SECRET_ACCESS_KEY=atlassecret
#   export ATLAS_STORE='s3://atlas/my-project?endpoint=http://localhost:8333&region=us-east-1'
#   bunx atlas report publish --producer unit --junit out.xml --specs ./specs
#   # then open http://localhost:8080
#
# The credentials above are for this demo only. Use a real bucket and a role in production.
services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/s3.json -dir=/data
    volumes:
      - ./s3.json:/etc/s3.json:ro
      - s3-data:/data
    ports:
      - "8333:8333"
  bucket:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment: { AWS_ACCESS_KEY_ID: atlaskey, AWS_SECRET_ACCESS_KEY: atlassecret, AWS_DEFAULT_REGION: us-east-1 }
    entrypoint: ["/bin/sh", "-c", "until aws --endpoint-url http://s3:8333 s3 mb s3://atlas 2>/dev/null || aws --endpoint-url http://s3:8333 s3 ls s3://atlas >/dev/null 2>&1; do sleep 2; done"]
    restart: "no"
  atlas:
    build:
      context: .
      args: { ATLAS_PACKAGE: "${ATLAS_PACKAGE:-@crvouga/atlas}" }
    depends_on: [bucket]
    environment:
      ATLAS_STORE: "s3://atlas/my-project?endpoint=http://s3:8333&region=us-east-1"
      AWS_ACCESS_KEY_ID: atlaskey
      AWS_SECRET_ACCESS_KEY: atlassecret
      ATLAS_INSECURE: "true"   # local demo; production needs tokens or an authenticated proxy
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  s3-data: {}
