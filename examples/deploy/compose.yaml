# The whole thing on one machine: the Atlas server, keeping its results on a volume.
#
#   docker compose up --build
#   # every environment sends its results to it (another terminal, a laptop, CI):
#   export ATLAS_STORE=http://localhost:8080 ATLAS_TOKEN=demo-token-change-me-123
#   bunx atlas report publish --producer unit --junit out.xml --specs ./specs
#   # or as they finish:   my-test-runner --json | bunx atlas report stream --producer unit
#   # then open http://localhost:8080
#
# The token is for this demo only. Use a long random one: openssl rand -hex 24
services:
  atlas:
    build:
      context: .
      args: { ATLAS_PACKAGE: "${ATLAS_PACKAGE:-@crvouga/atlas}" }
    environment:
      ATLAS_TOKEN: "${ATLAS_TOKEN:-demo-token-change-me-123}"
    ports:
      - "8080:8080"
    volumes:
      - atlas-data:/data
    restart: unless-stopped
volumes:
  atlas-data: {}
