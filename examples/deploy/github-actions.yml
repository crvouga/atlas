# Every CI job sends its own layers straight to the project's Atlas server: no artifacts to merge, nothing to
# coordinate, and the report on the server updates as each job finishes. Copy to .github/workflows/specs.yml.
#
# Secrets: ATLAS_PUBLISH_TOKEN (a `publish` token of the server) and ATLAS_READ_TOKEN (a `read` token, for the gate).
# Variable: ATLAS_URL, such as https://atlas.example.com.
name: specs
on: [push, pull_request]

permissions:
  contents: read

env:
  ATLAS_STORE: ${{ vars.ATLAS_URL }}

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { producer: unit, environment: desktop-web, run: bun test --reporter=junit --reporter-outfile=out.xml }
          - { producer: e2e,  environment: ios,         run: ./scripts/e2e-ios --junit out.xml }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}
        continue-on-error: true      # a failing suite must still publish: a failure is evidence
      - run: bunx atlas report publish --producer ${{ matrix.producer }} --junit out.xml --specs ./specs --environment ${{ matrix.environment }}
        if: always()
        env: { ATLAS_TOKEN: "${{ secrets.ATLAS_PUBLISH_TOKEN }}" }
      # To see a long suite while it runs, stream instead of publishing at the end (checks as JSON lines):
      #   - run: ./scripts/e2e-ios --json | bunx atlas report stream --producer e2e --environment ios
      #     env: { ATLAS_TOKEN: "${{ secrets.ATLAS_PUBLISH_TOKEN }}" }

  gate:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # This branch laid over main: what this run did not re-run is inherited from main's latest results,
      # and a laptop's work in progress or another branch's results cannot turn this red. The server works it out
      # from the layers it holds, so only the verdict travels, and the specs are those `publish --specs` sent from main. To
      # hold the PR to the specs of its own checkout instead, give the gate `--specs ./specs` and a read-capable store.
      - run: bunx atlas report status --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --branch main --ignore-modified --require-all-specs --require-environments desktop-web,ios --format markdown >> "$GITHUB_STEP_SUMMARY"
        env: { ATLAS_TOKEN: "${{ secrets.ATLAS_READ_TOKEN }}" }
        continue-on-error: true
      - run: bunx atlas report status --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --branch main --ignore-modified --require-all-specs --require-environments desktop-web,ios
        env: { ATLAS_TOKEN: "${{ secrets.ATLAS_READ_TOKEN }}" }
