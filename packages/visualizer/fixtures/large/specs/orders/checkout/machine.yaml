# Order checkout: generated fixture chart
id: Order checkout
initial: Handling the shopping cart
meta:
  description: Carts, checkout and order history.
  snapshot: order-checkout
  events: []
  confidence: confirmed
  source:
    - src/screens/order-checkout
  timeEvents:
    Approval of the shopping cart takes longer than a day: 1 day
  eventKinds:
    Payment processor approves the shopping cart: system
    Checks the shopping cart again: user
states:
  Handling the shopping cart:
    id: Handling the shopping cart
    initial: Reviewing the shopping cart
    meta:
      description: Everything about the shopping cart, from review to approval.
      snapshot: handling-the-shopping-cart
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-shopping-cart.tsx
      owner: Orders team
    states:
      Reviewing the shopping cart:
        id: Reviewing the shopping cart
        meta:
          description: The user checks the shopping cart before sending it.
          snapshot: reviewing-the-shopping-cart
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-shopping-cart.tsx
          gherkin:
            - features/orders/checkout/shopping-cart.feature
        on:
          Taps edit on the shopping cart:
            target: "#Editing the shopping cart"
          Submits the shopping cart:
            target: "#Waiting for the shopping cart to be approved"
      Editing the shopping cart:
        id: Editing the shopping cart
        initial: Editing the shopping cart details
        meta:
          description: The user changes the shopping cart, with an optional file.
          snapshot: editing-the-shopping-cart
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-shopping-cart.tsx
        states:
          Editing the shopping cart details:
            id: Editing the shopping cart details
            meta:
              description: A form with the shopping cart fields.
              snapshot: editing-the-shopping-cart-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-shopping-cart-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the shopping cart"
          Uploading a file for the shopping cart:
            id: Uploading a file for the shopping cart
            meta:
              description: A file picker for a document about the shopping cart.
              snapshot: uploading-a-file-for-the-shopping-cart
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-shopping-cart.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the shopping cart details"
        on:
          Saves the shopping cart:
            target: "#Reviewing the shopping cart"
          Cancels the changes to the shopping cart:
            target: "#Reviewing the shopping cart"
          Saving the shopping cart fails:
            target: "#Told the shopping cart could not be saved"
      Told the shopping cart could not be saved:
        id: Told the shopping cart could not be saved
        meta:
          description: A message says the shopping cart could not be saved, with "Try again".
          snapshot: told-the-shopping-cart-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-shopping-cart-could-not-be-saved.tsx
        on:
          Tries saving the shopping cart again:
            target: "#Editing the shopping cart"
      Waiting for the shopping cart to be approved:
        id: Waiting for the shopping cart to be approved
        meta:
          description: A card says the shopping cart is being checked.
          snapshot: waiting-for-the-shopping-cart-to-be-approved
          events:
            - Shopping cart submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-shopping-cart-to-be-approved.tsx
          tier: critical
        on:
          Payment processor approves the shopping cart:
            target: "#Told the shopping cart was approved"
          Payment processor rejects the shopping cart:
            target: "#Told the shopping cart was rejected"
          Approval of the shopping cart takes longer than a day:
            target: "#Told the shopping cart is still under review"
      Told the shopping cart is still under review:
        id: Told the shopping cart is still under review
        meta:
          description: A card says the shopping cart is still being checked.
          snapshot: told-the-shopping-cart-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-shopping-cart-is-still-under-review.tsx
        on:
          Checks the shopping cart again:
            target: "#Waiting for the shopping cart to be approved"
      Told the shopping cart was rejected:
        id: Told the shopping cart was rejected
        meta:
          description: A message explains why the shopping cart was not accepted.
          snapshot: told-the-shopping-cart-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-shopping-cart-was-rejected.tsx
        on:
          Starts the shopping cart again:
            target: "#Reviewing the shopping cart"
      Told the shopping cart was approved:
        id: Told the shopping cart was approved
        meta:
          description: A message confirms the shopping cart is approved.
          snapshot: told-the-shopping-cart-was-approved
          events:
            - Shopping cart approved
          confidence: confirmed
          source:
            - src/screens/told-the-shopping-cart-was-approved.tsx
        on:
          Continues to the delivery address:
            target: "#Handling the delivery address"
