# Sign-up: generated fixture chart
id: Sign-up
initial: Handling the account details
meta:
  description: Signing up and keeping a profile up to date.
  snapshot: sign-up
  events: []
  confidence: confirmed
  source:
    - src/screens/sign-up
states:
  Handling the account details:
    id: Handling the account details
    initial: Reviewing the account details
    meta:
      description: Everything about the account details, from review to approval.
      snapshot: handling-the-account-details
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-account-details.tsx
      owner: Accounts team
    states:
      Reviewing the account details:
        id: Reviewing the account details
        meta:
          description: The user checks the account details before sending it.
          snapshot: reviewing-the-account-details
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-account-details.tsx
          gherkin:
            - features/accounts/sign-up/account-details.feature
        on:
          Taps edit on the account details:
            target: "#Editing the account details"
          Submits the account details:
            target: "#Waiting for the account details to be approved"
      Editing the account details:
        id: Editing the account details
        initial: Editing the account details details
        meta:
          description: The user changes the account details, with an optional file.
          snapshot: editing-the-account-details
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-account-details.tsx
        states:
          Editing the account details details:
            id: Editing the account details details
            meta:
              description: A form with the account details fields.
              snapshot: editing-the-account-details-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-account-details-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the account details"
          Uploading a file for the account details:
            id: Uploading a file for the account details
            meta:
              description: A file picker for a document about the account details.
              snapshot: uploading-a-file-for-the-account-details
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-account-details.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the account details details"
        on:
          Saves the account details:
            target: "#Reviewing the account details"
          Cancels the changes to the account details:
            target: "#Reviewing the account details"
          Saving the account details fails:
            target: "#Told the account details could not be saved"
      Told the account details could not be saved:
        id: Told the account details could not be saved
        meta:
          description: A message says the account details could not be saved, with "Try again".
          snapshot: told-the-account-details-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-account-details-could-not-be-saved.tsx
        on:
          Tries saving the account details again:
            target: "#Editing the account details"
      Waiting for the account details to be approved:
        id: Waiting for the account details to be approved
        meta:
          description: A card says the account details is being checked.
          snapshot: waiting-for-the-account-details-to-be-approved
          events:
            - Account details submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-account-details-to-be-approved.tsx
          tier: critical
        on:
          Identity service approves the account details:
            target: "#Told the account details was approved"
          Identity service rejects the account details:
            target: "#Told the account details was rejected"
          Approval of the account details takes longer than a day:
            target: "#Told the account details is still under review"
      Told the account details is still under review:
        id: Told the account details is still under review
        meta:
          description: A card says the account details is still being checked.
          snapshot: told-the-account-details-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-account-details-is-still-under-review.tsx
        on:
          Checks the account details again:
            target: "#Waiting for the account details to be approved"
      Told the account details was rejected:
        id: Told the account details was rejected
        meta:
          description: A message explains why the account details was not accepted.
          snapshot: told-the-account-details-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-account-details-was-rejected.tsx
        on:
          Starts the account details again:
            target: "#Reviewing the account details"
      Told the account details was approved:
        id: Told the account details was approved
        meta:
          description: A message confirms the account details is approved.
          snapshot: told-the-account-details-was-approved
          events:
            - Account details approved
          confidence: confirmed
          source:
            - src/screens/told-the-account-details-was-approved.tsx
        on:
          Continues to the home address:
            target: "#Handling the home address"
