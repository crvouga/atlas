# Identity check: generated child chart
id: Identity check
initial: Handling the photo ID
meta:
  description: The identity check, a step inside sign-up.
  snapshot: identity-check
  events: []
  confidence: confirmed
  source: []
states:
  Handling the photo ID:
    id: Handling the photo ID
    initial: Reviewing the photo ID
    meta:
      description: Everything about the photo ID, from review to approval.
      snapshot: handling-the-photo-id
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-photo-id.tsx
      owner: Accounts team
    states:
      Reviewing the photo ID:
        id: Reviewing the photo ID
        meta:
          description: The user checks the photo ID before sending it.
          snapshot: reviewing-the-photo-id
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-photo-id.tsx
          gherkin:
            - features/accounts/sign-up/photo-id.feature
        on:
          Taps edit on the photo ID:
            target: "#Editing the photo ID"
          Submits the photo ID:
            target: "#Waiting for the photo ID to be approved"
          Closes the identity check:
            target: "#Identity check abandoned"
      Editing the photo ID:
        id: Editing the photo ID
        initial: Editing the photo ID details
        meta:
          description: The user changes the photo ID, with an optional file.
          snapshot: editing-the-photo-id
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-photo-id.tsx
        states:
          Editing the photo ID details:
            id: Editing the photo ID details
            meta:
              description: A form with the photo ID fields.
              snapshot: editing-the-photo-id-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-photo-id-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the photo ID"
          Uploading a file for the photo ID:
            id: Uploading a file for the photo ID
            meta:
              description: A file picker for a document about the photo ID.
              snapshot: uploading-a-file-for-the-photo-id
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-photo-id.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the photo ID details"
        on:
          Saves the photo ID:
            target: "#Reviewing the photo ID"
          Cancels the changes to the photo ID:
            target: "#Reviewing the photo ID"
          Saving the photo ID fails:
            target: "#Told the photo ID could not be saved"
      Told the photo ID could not be saved:
        id: Told the photo ID could not be saved
        meta:
          description: A message says the photo ID could not be saved, with "Try again".
          snapshot: told-the-photo-id-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-photo-id-could-not-be-saved.tsx
        on:
          Tries saving the photo ID again:
            target: "#Editing the photo ID"
      Waiting for the photo ID to be approved:
        id: Waiting for the photo ID to be approved
        meta:
          description: A card says the photo ID is being checked.
          snapshot: waiting-for-the-photo-id-to-be-approved
          events:
            - Photo ID submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-photo-id-to-be-approved.tsx
          tier: critical
        on:
          Identity service approves the photo ID:
            target: "#Told the photo ID was approved"
          Identity service rejects the photo ID:
            target: "#Told the photo ID was rejected"
          Approval of the photo ID takes longer than a day:
            target: "#Told the photo ID is still under review"
      Told the photo ID is still under review:
        id: Told the photo ID is still under review
        meta:
          description: A card says the photo ID is still being checked.
          snapshot: told-the-photo-id-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-photo-id-is-still-under-review.tsx
        on:
          Checks the photo ID again:
            target: "#Waiting for the photo ID to be approved"
      Told the photo ID was rejected:
        id: Told the photo ID was rejected
        meta:
          description: A message explains why the photo ID was not accepted.
          snapshot: told-the-photo-id-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-photo-id-was-rejected.tsx
        on:
          Starts the photo ID again:
            target: "#Reviewing the photo ID"
      Told the photo ID was approved:
        id: Told the photo ID was approved
        meta:
          description: A message confirms the photo ID is approved.
          snapshot: told-the-photo-id-was-approved
          events:
            - Photo ID approved
          confidence: confirmed
          source:
            - src/screens/told-the-photo-id-was-approved.tsx
        on:
          Continues to the selfie match:
            target: "#Handling the selfie match"
