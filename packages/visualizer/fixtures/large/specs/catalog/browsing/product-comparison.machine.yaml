# Product comparison: generated child chart
id: Product comparison
initial: Handling the comparison list
meta:
  description: The product comparison, a step inside product browsing.
  snapshot: product-comparison
  events: []
  confidence: confirmed
  source: []
states:
  Handling the comparison list:
    id: Handling the comparison list
    initial: Reviewing the comparison list
    meta:
      description: Everything about the comparison list, from review to approval.
      snapshot: handling-the-comparison-list
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-comparison-list.tsx
      owner: Catalog team
    states:
      Reviewing the comparison list:
        id: Reviewing the comparison list
        meta:
          description: The user checks the comparison list before sending it.
          snapshot: reviewing-the-comparison-list
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-comparison-list.tsx
          gherkin:
            - features/catalog/browsing/comparison-list.feature
        on:
          Taps edit on the comparison list:
            target: "#Editing the comparison list"
          Submits the comparison list:
            target: "#Waiting for the comparison list to be approved"
          Closes the product comparison:
            target: "#Product comparison abandoned"
      Editing the comparison list:
        id: Editing the comparison list
        initial: Editing the comparison list details
        meta:
          description: The user changes the comparison list, with an optional file.
          snapshot: editing-the-comparison-list
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-comparison-list.tsx
        states:
          Editing the comparison list details:
            id: Editing the comparison list details
            meta:
              description: A form with the comparison list fields.
              snapshot: editing-the-comparison-list-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-comparison-list-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the comparison list"
          Uploading a file for the comparison list:
            id: Uploading a file for the comparison list
            meta:
              description: A file picker for a document about the comparison list.
              snapshot: uploading-a-file-for-the-comparison-list
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-comparison-list.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the comparison list details"
        on:
          Saves the comparison list:
            target: "#Reviewing the comparison list"
          Cancels the changes to the comparison list:
            target: "#Reviewing the comparison list"
          Saving the comparison list fails:
            target: "#Told the comparison list could not be saved"
      Told the comparison list could not be saved:
        id: Told the comparison list could not be saved
        meta:
          description: A message says the comparison list could not be saved, with "Try again".
          snapshot: told-the-comparison-list-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-comparison-list-could-not-be-saved.tsx
        on:
          Tries saving the comparison list again:
            target: "#Editing the comparison list"
      Waiting for the comparison list to be approved:
        id: Waiting for the comparison list to be approved
        meta:
          description: A card says the comparison list is being checked.
          snapshot: waiting-for-the-comparison-list-to-be-approved
          events:
            - Comparison list submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-comparison-list-to-be-approved.tsx
          tier: critical
        on:
          Catalog service approves the comparison list:
            target: "#Told the comparison list was approved"
          Catalog service rejects the comparison list:
            target: "#Told the comparison list was rejected"
          Approval of the comparison list takes longer than a day:
            target: "#Told the comparison list is still under review"
      Told the comparison list is still under review:
        id: Told the comparison list is still under review
        meta:
          description: A card says the comparison list is still being checked.
          snapshot: told-the-comparison-list-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-comparison-list-is-still-under-review.tsx
        on:
          Checks the comparison list again:
            target: "#Waiting for the comparison list to be approved"
      Told the comparison list was rejected:
        id: Told the comparison list was rejected
        meta:
          description: A message explains why the comparison list was not accepted.
          snapshot: told-the-comparison-list-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-comparison-list-was-rejected.tsx
        on:
          Starts the comparison list again:
            target: "#Reviewing the comparison list"
      Told the comparison list was approved:
        id: Told the comparison list was approved
        meta:
          description: A message confirms the comparison list is approved.
          snapshot: told-the-comparison-list-was-approved
          events:
            - Comparison list approved
          confidence: confirmed
          source:
            - src/screens/told-the-comparison-list-was-approved.tsx
        on:
          Continues to the comparison table:
            target: "#Handling the comparison table"
