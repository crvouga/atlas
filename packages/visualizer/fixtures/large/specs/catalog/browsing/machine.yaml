# Product browsing: generated fixture chart
id: Product browsing
initial: Handling the search filters
meta:
  description: Finding and comparing products.
  snapshot: product-browsing
  events: []
  confidence: confirmed
  source:
    - src/screens/product-browsing
states:
  Handling the search filters:
    id: Handling the search filters
    initial: Reviewing the search filters
    meta:
      description: Everything about the search filters, from review to approval.
      snapshot: handling-the-search-filters
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-search-filters.tsx
      owner: Catalog team
    states:
      Reviewing the search filters:
        id: Reviewing the search filters
        meta:
          description: The user checks the search filters before sending it.
          snapshot: reviewing-the-search-filters
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-search-filters.tsx
          gherkin:
            - features/catalog/browsing/search-filters.feature
        on:
          Taps edit on the search filters:
            target: "#Editing the search filters"
          Submits the search filters:
            target: "#Waiting for the search filters to be approved"
      Editing the search filters:
        id: Editing the search filters
        initial: Editing the search filters details
        meta:
          description: The user changes the search filters, with an optional file.
          snapshot: editing-the-search-filters
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-search-filters.tsx
        states:
          Editing the search filters details:
            id: Editing the search filters details
            meta:
              description: A form with the search filters fields.
              snapshot: editing-the-search-filters-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-search-filters-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the search filters"
          Uploading a file for the search filters:
            id: Uploading a file for the search filters
            meta:
              description: A file picker for a document about the search filters.
              snapshot: uploading-a-file-for-the-search-filters
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-search-filters.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the search filters details"
        on:
          Saves the search filters:
            target: "#Reviewing the search filters"
          Cancels the changes to the search filters:
            target: "#Reviewing the search filters"
          Saving the search filters fails:
            target: "#Told the search filters could not be saved"
      Told the search filters could not be saved:
        id: Told the search filters could not be saved
        meta:
          description: A message says the search filters could not be saved, with "Try again".
          snapshot: told-the-search-filters-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-search-filters-could-not-be-saved.tsx
        on:
          Tries saving the search filters again:
            target: "#Editing the search filters"
      Waiting for the search filters to be approved:
        id: Waiting for the search filters to be approved
        meta:
          description: A card says the search filters is being checked.
          snapshot: waiting-for-the-search-filters-to-be-approved
          events:
            - Search filters submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-search-filters-to-be-approved.tsx
          tier: critical
        on:
          Catalog service approves the search filters:
            target: "#Told the search filters was approved"
          Catalog service rejects the search filters:
            target: "#Told the search filters was rejected"
          Approval of the search filters takes longer than a day:
            target: "#Told the search filters is still under review"
      Told the search filters is still under review:
        id: Told the search filters is still under review
        meta:
          description: A card says the search filters is still being checked.
          snapshot: told-the-search-filters-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-search-filters-is-still-under-review.tsx
        on:
          Checks the search filters again:
            target: "#Waiting for the search filters to be approved"
      Told the search filters was rejected:
        id: Told the search filters was rejected
        meta:
          description: A message explains why the search filters was not accepted.
          snapshot: told-the-search-filters-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-search-filters-was-rejected.tsx
        on:
          Starts the search filters again:
            target: "#Reviewing the search filters"
      Told the search filters was approved:
        id: Told the search filters was approved
