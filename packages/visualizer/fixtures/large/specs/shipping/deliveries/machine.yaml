    states:
      Reviewing the shipping label:
        id: Reviewing the shipping label
        meta:
          description: The user checks the shipping label before sending it.
          snapshot: reviewing-the-shipping-label
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-shipping-label.tsx
          gherkin:
            - features/shipping/deliveries/shipping-label.feature
        on:
          Taps edit on the shipping label:
            target: "#Editing the shipping label"
          Submits the shipping label:
            target: "#Waiting for the shipping label to be approved"
      Editing the shipping label:
        id: Editing the shipping label
        initial: Editing the shipping label details
        meta:
          description: The user changes the shipping label, with an optional file.
          snapshot: editing-the-shipping-label
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-shipping-label.tsx
        states:
          Editing the shipping label details:
            id: Editing the shipping label details
            meta:
              description: A form with the shipping label fields.
              snapshot: editing-the-shipping-label-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-shipping-label-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the shipping label"
          Uploading a file for the shipping label:
            id: Uploading a file for the shipping label
            meta:
              description: A file picker for a document about the shipping label.
              snapshot: uploading-a-file-for-the-shipping-label
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-shipping-label.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the shipping label details"
        on:
          Saves the shipping label:
            target: "#Reviewing the shipping label"
          Cancels the changes to the shipping label:
            target: "#Reviewing the shipping label"
          Saving the shipping label fails:
            target: "#Told the shipping label could not be saved"
      Told the shipping label could not be saved:
        id: Told the shipping label could not be saved
        meta:
          description: A message says the shipping label could not be saved, with "Try again".
          snapshot: told-the-shipping-label-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-shipping-label-could-not-be-saved.tsx
        on:
          Tries saving the shipping label again:
            target: "#Editing the shipping label"
      Waiting for the shipping label to be approved:
        id: Waiting for the shipping label to be approved
        meta:
          description: A card says the shipping label is being checked.
          snapshot: waiting-for-the-shipping-label-to-be-approved
          events:
            - Shipping label submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-shipping-label-to-be-approved.tsx
          tier: critical
        on:
          Carrier approves the shipping label:
            target: "#Told the shipping label was approved"
          Carrier rejects the shipping label:
            target: "#Told the shipping label was rejected"
          Approval of the shipping label takes longer than a day:
            target: "#Told the shipping label is still under review"
      Told the shipping label is still under review:
        id: Told the shipping label is still under review
        meta:
          description: A card says the shipping label is still being checked.
          snapshot: told-the-shipping-label-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-shipping-label-is-still-under-review.tsx
        on:
          Checks the shipping label again:
            target: "#Waiting for the shipping label to be approved"
      Told the shipping label was rejected:
        id: Told the shipping label was rejected
        meta:
          description: A message explains why the shipping label was not accepted.
          snapshot: told-the-shipping-label-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-shipping-label-was-rejected.tsx
        on:
