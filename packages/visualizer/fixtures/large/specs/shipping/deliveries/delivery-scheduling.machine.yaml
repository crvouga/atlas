# Delivery scheduling: generated child chart
id: Delivery scheduling
initial: Handling the delivery slot
meta:
  description: The delivery scheduling, a step inside deliveries.
  snapshot: delivery-scheduling
  events: []
  confidence: confirmed
  source: []
states:
  Handling the delivery slot:
    id: Handling the delivery slot
    initial: Reviewing the delivery slot
    meta:
      description: Everything about the delivery slot, from review to approval.
      snapshot: handling-the-delivery-slot
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-delivery-slot.tsx
      owner: Fulfillment team
    states:
      Reviewing the delivery slot:
        id: Reviewing the delivery slot
        meta:
          description: The user checks the delivery slot before sending it.
          snapshot: reviewing-the-delivery-slot
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-delivery-slot.tsx
          gherkin:
            - features/shipping/deliveries/delivery-slot.feature
        on:
          Taps edit on the delivery slot:
            target: "#Editing the delivery slot"
          Submits the delivery slot:
            target: "#Waiting for the delivery slot to be approved"
          Closes the delivery scheduling:
            target: "#Delivery scheduling abandoned"
      Editing the delivery slot:
        id: Editing the delivery slot
        initial: Editing the delivery slot details
        meta:
          description: The user changes the delivery slot, with an optional file.
          snapshot: editing-the-delivery-slot
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-delivery-slot.tsx
        states:
          Editing the delivery slot details:
            id: Editing the delivery slot details
            meta:
              description: A form with the delivery slot fields.
              snapshot: editing-the-delivery-slot-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-delivery-slot-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the delivery slot"
          Uploading a file for the delivery slot:
            id: Uploading a file for the delivery slot
            meta:
              description: A file picker for a document about the delivery slot.
              snapshot: uploading-a-file-for-the-delivery-slot
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-delivery-slot.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the delivery slot details"
        on:
          Saves the delivery slot:
            target: "#Reviewing the delivery slot"
          Cancels the changes to the delivery slot:
            target: "#Reviewing the delivery slot"
          Saving the delivery slot fails:
            target: "#Told the delivery slot could not be saved"
      Told the delivery slot could not be saved:
        id: Told the delivery slot could not be saved
        meta:
          description: A message says the delivery slot could not be saved, with "Try again".
          snapshot: told-the-delivery-slot-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-delivery-slot-could-not-be-saved.tsx
        on:
          Tries saving the delivery slot again:
            target: "#Editing the delivery slot"
      Waiting for the delivery slot to be approved:
        id: Waiting for the delivery slot to be approved
        meta:
          description: A card says the delivery slot is being checked.
          snapshot: waiting-for-the-delivery-slot-to-be-approved
          events:
            - Delivery slot submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-delivery-slot-to-be-approved.tsx
          tier: critical
        on:
          Carrier approves the delivery slot:
            target: "#Told the delivery slot was approved"
          Carrier rejects the delivery slot:
            target: "#Told the delivery slot was rejected"
          Approval of the delivery slot takes longer than a day:
            target: "#Told the delivery slot is still under review"
      Told the delivery slot is still under review:
        id: Told the delivery slot is still under review
        meta:
          description: A card says the delivery slot is still being checked.
          snapshot: told-the-delivery-slot-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-delivery-slot-is-still-under-review.tsx
        on:
          Checks the delivery slot again:
            target: "#Waiting for the delivery slot to be approved"
      Told the delivery slot was rejected:
        id: Told the delivery slot was rejected
        meta:
          description: A message explains why the delivery slot was not accepted.
          snapshot: told-the-delivery-slot-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-delivery-slot-was-rejected.tsx
        on:
          Starts the delivery slot again:
            target: "#Reviewing the delivery slot"
      Told the delivery slot was approved:
        id: Told the delivery slot was approved
        meta:
          description: A message confirms the delivery slot is approved.
          snapshot: told-the-delivery-slot-was-approved
          events:
            - Delivery slot approved
          confidence: confirmed
          source:
            - src/screens/told-the-delivery-slot-was-approved.tsx
        on:
          Continues to the delivery reminder:
            target: "#Handling the delivery reminder"
