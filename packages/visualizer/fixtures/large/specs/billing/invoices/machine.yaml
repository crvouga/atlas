    - src/screens/invoices-and-payments
states:
  Handling the monthly invoice:
    id: Handling the monthly invoice
    initial: Reviewing the monthly invoice
    meta:
      description: Everything about the monthly invoice, from review to approval.
      snapshot: handling-the-monthly-invoice
      events: []
      confidence: confirmed
      source:
        - src/screens/handling-the-monthly-invoice.tsx
      owner: Billing team
    states:
      Reviewing the monthly invoice:
        id: Reviewing the monthly invoice
        meta:
          description: The user checks the monthly invoice before sending it.
          snapshot: reviewing-the-monthly-invoice
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-monthly-invoice.tsx
          gherkin:
            - features/billing/invoices/monthly-invoice.feature
        on:
          Taps edit on the monthly invoice:
            target: "#Editing the monthly invoice"
          Submits the monthly invoice:
            target: "#Waiting for the monthly invoice to be approved"
      Editing the monthly invoice:
        id: Editing the monthly invoice
        initial: Editing the monthly invoice details
        meta:
          description: The user changes the monthly invoice, with an optional file.
          snapshot: editing-the-monthly-invoice
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-monthly-invoice.tsx
        states:
          Editing the monthly invoice details:
            id: Editing the monthly invoice details
            meta:
              description: A form with the monthly invoice fields.
              snapshot: editing-the-monthly-invoice-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-monthly-invoice-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the monthly invoice"
          Uploading a file for the monthly invoice:
            id: Uploading a file for the monthly invoice
            meta:
              description: A file picker for a document about the monthly invoice.
              snapshot: uploading-a-file-for-the-monthly-invoice
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-monthly-invoice.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the monthly invoice details"
        on:
          Saves the monthly invoice:
            target: "#Reviewing the monthly invoice"
          Cancels the changes to the monthly invoice:
            target: "#Reviewing the monthly invoice"
          Saving the monthly invoice fails:
            target: "#Told the monthly invoice could not be saved"
      Told the monthly invoice could not be saved:
        id: Told the monthly invoice could not be saved
        meta:
          description: A message says the monthly invoice could not be saved, with "Try again".
          snapshot: told-the-monthly-invoice-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-monthly-invoice-could-not-be-saved.tsx
        on:
          Tries saving the monthly invoice again:
            target: "#Editing the monthly invoice"
      Waiting for the monthly invoice to be approved:
        id: Waiting for the monthly invoice to be approved
        meta:
          description: A card says the monthly invoice is being checked.
          snapshot: waiting-for-the-monthly-invoice-to-be-approved
          events:
            - Monthly invoice submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-monthly-invoice-to-be-approved.tsx
          tier: critical
        on:
          Billing service approves the monthly invoice:
            target: "#Told the monthly invoice was approved"
          Billing service rejects the monthly invoice:
            target: "#Told the monthly invoice was rejected"
          Approval of the monthly invoice takes longer than a day:
            target: "#Told the monthly invoice is still under review"
      Told the monthly invoice is still under review:
        id: Told the monthly invoice is still under review
        meta:
          description: A card says the monthly invoice is still being checked.
          snapshot: told-the-monthly-invoice-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-monthly-invoice-is-still-under-review.tsx
        on:
          Checks the monthly invoice again:
            target: "#Waiting for the monthly invoice to be approved"
      Told the monthly invoice was rejected:
        id: Told the monthly invoice was rejected
        meta:
          description: A message explains why the monthly invoice was not accepted.
          snapshot: told-the-monthly-invoice-was-rejected
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-monthly-invoice-was-rejected.tsx
        on:
          Starts the monthly invoice again:
            target: "#Reviewing the monthly invoice"
      Told the monthly invoice was approved:
        id: Told the monthly invoice was approved
        meta:
          description: A message confirms the monthly invoice is approved.
          snapshot: told-the-monthly-invoice-was-approved
          events:
            - Monthly invoice approved
          confidence: confirmed
          source:
            - src/screens/told-the-monthly-invoice-was-approved.tsx
        on:
          Continues to the paid invoice:
            target: "#Handling the paid invoice"
