        on:
          Saves the escalation note:
            target: "#Reviewing the escalation note"
          Cancels the changes to the escalation note:
            target: "#Reviewing the escalation note"
          Saving the escalation note fails:
            target: "#Told the escalation note could not be saved"
      Told the escalation note could not be saved:
        id: Told the escalation note could not be saved
        meta:
          description: A message says the escalation note could not be saved, with "Try again".
