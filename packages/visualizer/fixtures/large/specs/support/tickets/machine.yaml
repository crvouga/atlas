          snapshot: reviewing-the-help-request
          events: []
          confidence: confirmed
          source:
            - src/screens/reviewing-the-help-request.tsx
          gherkin:
            - features/support/tickets/help-request.feature
        on:
          Taps edit on the help request:
            target: "#Editing the help request"
          Submits the help request:
            target: "#Waiting for the help request to be approved"
      Editing the help request:
        id: Editing the help request
        initial: Editing the help request details
        meta:
          description: The user changes the help request, with an optional file.
          snapshot: editing-the-help-request
          events: []
          confidence: confirmed
          source:
            - src/screens/editing-the-help-request.tsx
        states:
          Editing the help request details:
            id: Editing the help request details
            meta:
              description: A form with the help request fields.
              snapshot: editing-the-help-request-details
              events: []
              confidence: confirmed
              source:
                - src/screens/editing-the-help-request-details.tsx
              hints:
                - A text field per detail
                - An "Upload a file" link
            on:
              Uploads a file:
                target: "#Uploading a file for the help request"
          Uploading a file for the help request:
            id: Uploading a file for the help request
            meta:
              description: A file picker for a document about the help request.
              snapshot: uploading-a-file-for-the-help-request
              events: []
              confidence: confirmed
              source:
                - src/screens/uploading-a-file-for-the-help-request.tsx
            on:
              Finishes uploading the file:
                target: "#Editing the help request details"
        on:
          Saves the help request:
            target: "#Reviewing the help request"
          Cancels the changes to the help request:
            target: "#Reviewing the help request"
          Saving the help request fails:
            target: "#Told the help request could not be saved"
      Told the help request could not be saved:
        id: Told the help request could not be saved
        meta:
          description: A message says the help request could not be saved, with "Try again".
          snapshot: told-the-help-request-could-not-be-saved
          events: []
          confidence: confirmed
          source:
            - src/screens/told-the-help-request-could-not-be-saved.tsx
        on:
          Tries saving the help request again:
            target: "#Editing the help request"
      Waiting for the help request to be approved:
        id: Waiting for the help request to be approved
        meta:
          description: A card says the help request is being checked.
          snapshot: waiting-for-the-help-request-to-be-approved
          events:
            - Help request submitted
          confidence: confirmed
          source:
            - src/screens/waiting-for-the-help-request-to-be-approved.tsx
          tier: critical
        on:
          Support desk approves the help request:
            target: "#Told the help request was approved"
          Support desk rejects the help request:
            target: "#Told the help request was rejected"
          Approval of the help request takes longer than a day:
            target: "#Told the help request is still under review"
      Told the help request is still under review:
        id: Told the help request is still under review
        meta:
          description: A card says the help request is still being checked.
          snapshot: told-the-help-request-is-still-under-review
          events: []
          confidence: assumed
          source:
            - src/screens/told-the-help-request-is-still-under-review.tsx
        on:
          Checks the help request again:
            target: "#Waiting for the help request to be approved"
      Told the help request was rejected:
        id: Told the help request was rejected
        meta:
          description: A message explains why the help request was not accepted.
          snapshot: told-the-help-request-was-rejected
